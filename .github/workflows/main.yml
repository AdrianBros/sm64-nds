name: Compilar SM64 NDS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas base de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libaudiofile-dev sox bsdmainutils wget curl

      - name: Instalar devkitPro mediante Script Oficial
        run: |
          # Descargar y ejecutar el script automatizado oficial de devkitPro
          wget https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          
          # Instalar las herramientas específicas para compilar en Nintendo DS
          sudo dkp-pacman -Syyu --noconfirm
          sudo dkp-pacman -S nds-dev --noconfirm

      - name: Compilar juego de forma nativa
        run: |
          # Activar las variables de entorno necesarias para el compilador
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          
          # Compilar la versión de USA
          make VERSION=us -j4

      - name: Guardar archivo ejecutable (.NDS)
        uses: actions/upload-artifact@v4
        with:
          name: super-mario-64-nds
          path: build/us/*.nds
