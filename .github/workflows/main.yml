name: Compilar SM64 NDS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias nativas en el servidor
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libaudiofile-dev sox bsdmainutils

      - name: Descargar e instalar compilador de Nintendo DS (devkitpro)
        run: |
          sudo apt-get install -y gdebi-core
          wget https://github.com
          sudo gdebi -n devkitpro-pacman.amd64.deb
          sudo dkp-pacman -Syyu --noconfirm
          sudo dkp-pacman -S nds-dev --noconfirm

      - name: Compilar juego de forma nativa
        run: |
          # Configurar variables de entorno para que el sistema encuentre el compilador de NDS
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          
          # Compilar la versión de USA
          make VERSION=us -j4

      - name: Guardar archivo ejecutable (.NDS)
        uses: actions/upload-artifact@v4
        with:
          name: super-mario-64-.nds
          path: build/us/*.nds
