name: Compilar SM64 NDS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir entorno de compilación (Docker)
        run: |
          docker build -t sm64 .

      - name: Compilar juego usando Docker
        run: |
          docker run --rm --mount type=bind,source="$(pwd)",destination=/sm64 sm64 make VERSION=us -j4

      - name: Guardar archivo ejecutable (.NDS)
        uses: actions/upload-artifact@v4
        with:
          name: super-mario-64-nds
          path: build/us/*.nds
